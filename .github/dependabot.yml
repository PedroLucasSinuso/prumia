# Atualizações de dependências: um PR por semana e por ecossistema, agrupando as versões menores e de correção.
# Versões maiores vêm em PR separado, para serem lidas com calma. Alertas de segurança abrem PR na hora.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build" }
    groups:
      go: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build" }
    groups:
      web: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build" }
    groups:
      site: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build" }
    groups:
      e2e: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci" }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: monthly }
    commit-message: { prefix: "build" }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: monthly }
    commit-message: { prefix: "build" }
