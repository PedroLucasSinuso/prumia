openapi: 3.0.3
info:
  title: prumia API
  version: 0.1.0
  description: |
    API do prumia (finanças domésticas). Contrato **spec-first**: este arquivo é a fonte de verdade.

    Convenções:
    - Dinheiro: inteiro em **centavos** (BRL). R$ 660,00 = `66000`.
    - Datas: `YYYY-MM-DD`. Mês: dia 1 (`2026-10-01`).
    - Autenticação: cookie de sessão httpOnly (`prumia_session`). A sessão vale 30 dias desde o último uso (renovada
      com o uso) e morre de vez `SESSION_MAX_AGE_DAYS` dias após o login (padrão 90), mesmo em uso. Sessão vencida
      responde 401 `unauthenticated` e o cookie é apagado.
    - Casa: rotas de negócio ficam sob `/households/{householdId}`; o acesso é validado pela role do usuário.
    - Erros: `application/problem+json` (ver `Problem`).
    - Limite de corpo: requisições JSON acima de 64 KB respondem 413 (`code=body_too_large`); o upload de boleto/documento tem limite próprio (5 MB) e o lote de invoices aceita até 512 KB.
servers:
  - url: /api
tags:
  - { name: system, description: "Saúde e operação" }
  - { name: auth, description: "Cadastro, login e sessão" }
  - { name: households, description: "Casas, membros e convites" }
  - { name: categories, description: "Categorias de despesa" }
  - { name: payees, description: "Favorecidos (apelido + CNPJ opcional)" }
  - { name: wallets, description: "Carteiras da casa (saldo por carteira)" }
  - { name: transfers, description: "Transferências entre carteiras" }
  - { name: adjustments, description: "Ajustes de saldo das carteiras (Conferir saldo)" }
  - { name: reserve, description: "Meta da reserva de emergência" }
  - { name: invoices, description: "Despesas (contas, parcelas, recorrências)" }
  - { name: incomes, description: "Receitas (salário, benefício)" }
  - { name: summary, description: "Resumo mensal" }
  - { name: boleto, description: "Leitura de boleto" }

security:
  - cookieAuth: []

paths:
  # ----------------------------------------------------------------- system
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Verifica se a API e o banco estão respondendo
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
        '503': { description: Banco indisponível, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ------------------------------------------------------------------ auth
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Cria usuário a partir de um convite ou cria uma nova casa
      description: |
        Sem `inviteToken`, cria o usuário e uma casa nova (o usuário é admin). Com `inviteToken`, entra na casa do convite.
        O cadastro **sem convite** só é aceito para o primeiro usuário do sistema (que vira o dono do sistema), salvo se o
        servidor tiver `OPEN_REGISTRATION=true` ou se vier um `signupToken` (convite de cadastro gerado pelo dono do sistema:
        conta e casa próprias); sem nada disso responde 403 (`registration_closed`). `signupToken` inválido, vencido, usado ou
        revogado responde 400 (`invalid_signup_invite`) e nada é gravado. Define o cookie de sessão.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: "Criado e autenticado", content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login (define cookie de sessão)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: "Autenticado", content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Encerra a sessão
      responses:
        '204': { description: "Sessão encerrada" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuário atual e suas casas
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Atualiza o próprio nome e/ou o tema de cor (preferência da conta, vale em todos os aparelhos)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MePatch' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Troca a própria senha (confere a atual) e encerra as OUTRAS sessões do usuário
      description: |
        A sessão atual continua válida. Senha atual errada responde 400 com `fields.currentPassword`.
        Tem limite de tentativas como o login (429 `too_many_requests`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 10, maxLength: 128 }
      responses:
        '204': { description: "Senha trocada" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/sessions/others:
    delete:
      tags: [auth]
      operationId: endOtherSessions
      summary: Sai de todos os outros aparelhos (encerra as sessões do usuário, menos a atual)
      responses:
        '200':
          description: "Sessões encerradas"
          content:
            application/json:
              schema:
                type: object
                required: [ended]
                properties:
                  ended: { type: integer, description: "Quantas sessões foram encerradas" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/signup-invites:
    get:
      tags: [auth]
      operationId: listSignupInvites
      summary: Convites de cadastro pendentes (só o dono do sistema)
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SignupInvite' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [auth]
      operationId: createSignupInvite
      summary: Gera um convite de cadastro (conta e casa próprias) de uso único (só o dono do sistema)
      description: |
        O token em claro vem só nesta resposta; no banco fica o hash SHA-256. Validade de 1 a 168 horas (padrão 48).
        Até 5 pendentes ao mesmo tempo (409 `signup_invite_limit`).
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/SignupInviteInput' } } }
      responses:
        '201': { description: "Criado", content: { application/json: { schema: { $ref: '#/components/schemas/SignupInviteCreated' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/signup-invites/{inviteId}:
    parameters:
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [auth]
      operationId: revokeSignupInvite
      summary: Revoga um convite de cadastro pendente (só o dono do sistema). Já revogado = 204
      responses:
        '204': { description: "Revogado" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/password-reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Redefine a senha com o link gerado por um admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 10 }
      responses:
        '204': { description: "Senha redefinida" }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------ households
  /households:
    post:
      tags: [households]
      operationId: createHousehold
      summary: Cria uma casa (o usuário vira admin) com categorias padrão
      description: |
        Cada usuário pode ter no máximo `MAX_HOUSEHOLDS_PER_USER` casas ativas criadas por ele (padrão 5; casas
        excluídas não contam, casas em que ele só entrou por convite também não). Passou do limite: 409 `household_limit`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        '201': { description: "Criada", content: { application/json: { schema: { $ref: '#/components/schemas/Household' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [households]
      operationId: getHousehold
      summary: Detalhes da casa
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Household' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [households]
      operationId: updateHousehold
      summary: Renomeia a casa (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Household' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [households]
      operationId: deleteHousehold
      summary: Exclui a casa (admin, exclusão lógica)
      responses:
        '204': { description: "Excluída" }
        '403': { $ref: '#/components/responses/Forbidden' }
  /households/{householdId}/members:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [households]
      operationId: listMembers
      summary: Membros ativos
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
  /households/{householdId}/members/{userId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { $ref: '#/components/parameters/UserId' }
    patch:
      tags: [households]
      operationId: updateMemberRole
      summary: Altera a role (admin). Mantém ao menos um admin ativo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { $ref: '#/components/schemas/Role' } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [households]
      operationId: removeMember
      summary: Remove o membro (admin) ou sai da casa (o próprio). Define `left_at`.
      responses:
        '204': { description: "Removido" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/invites:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    post:
      tags: [households]
      operationId: createInvite
      summary: Gera convite por link (admin). O token só é devolvido nesta resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                expiresInHours: { type: integer, minimum: 1, maximum: 168, default: 48 }
      responses:
        '201': { description: "Criado", content: { application/json: { schema: { $ref: '#/components/schemas/InviteCreated' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /households/{householdId}/invites/{inviteId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: inviteId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [households]
      operationId: revokeInvite
      summary: Revoga um convite pendente (admin)
      responses:
        '204': { description: "Revogado" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /invites/accept:
    post:
      tags: [households]
      operationId: acceptInvite
      summary: Usuário logado entra em outra casa com um token de convite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        '200': { description: "Entrou", content: { application/json: { schema: { $ref: '#/components/schemas/Household' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/members/{userId}/password-reset-link:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { $ref: '#/components/parameters/UserId' }
    post:
      tags: [households]
      operationId: createPasswordResetLink
      summary: Gera link de redefinição de senha para um membro (admin de todas as casas dele)
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ categories
  /households/{householdId}/categories:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [categories]
      operationId: listCategories
      summary: Categorias da casa
      parameters:
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }
    post:
      tags: [categories]
      operationId: createCategory
      summary: Cria categoria (member+)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryInput' } } }
      responses:
        '201': { description: "Criada", content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/categories/{categoryId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Edita ou arquiva categoria
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CategoryPatch' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Category' } } } }
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: Exclui categoria sem uso e sem subcategorias. Em uso ou com subcategorias, responde 409.
      responses:
        '204': { description: "Excluída" }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ cnpj
  /cnpj/{cnpj}:
    parameters:
      - { name: cnpj, in: path, required: true, description: "14 dígitos", schema: { type: string, maxLength: 30 } }
    get:
      tags: [payees]
      operationId: lookupCnpj
      summary: Consulta razão social e nome fantasia de um CNPJ na BrasilAPI (cache e prazo curto)
      responses:
        '200': { description: "Empresa", content: { application/json: { schema: { $ref: '#/components/schemas/CnpjInfo' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: "Consulta indisponível (a BrasilAPI caiu ou está desligada); o app segue sem ela", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  # ---------------------------------------------------------------- payees
  /households/{householdId}/payees:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [payees]
      operationId: listPayees
      summary: Favorecidos da casa
      parameters:
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Payee' } } } } }
    post:
      tags: [payees]
      operationId: createPayee
      summary: Cria favorecido (member+)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayeeInput' } } }
      responses:
        '201': { description: "Criado", content: { application/json: { schema: { $ref: '#/components/schemas/Payee' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/payees/{payeeId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: payeeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [payees]
      operationId: updatePayee
      summary: Edita ou arquiva favorecido
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayeePatch' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Payee' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [payees]
      operationId: deletePayee
      summary: Exclui favorecido sem uso. Em uso, responde 409 (arquive em vez disso).
      responses:
        '204': { description: "Excluído" }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --------------------------------------------------------------- wallets
  /households/{householdId}/wallets:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [wallets]
      operationId: listWallets
      summary: Carteiras da casa (qualquer membro). A padrão vem primeiro, depois por sortOrder e nome.
      parameters:
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Wallet' } } } } }
    post:
      tags: [wallets]
      operationId: createWallet
      summary: Cria carteira (só admin, o Responsável)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WalletInput' } } }
      responses:
        '201': { description: "Criada", content: { application/json: { schema: { $ref: '#/components/schemas/Wallet' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/wallets/{walletId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [wallets]
      operationId: updateWallet
      summary: Edita carteira (só admin)
      description: |
        Nome, dono (etiqueta; `null` limpa), aviso de saldo, saldo inicial e ordem. `isDefault=true` troca a carteira
        padrão da casa (a anterior deixa de ser padrão; a padrão não pode ser arquivada, e `isDefault=false` é 400:
        escolha outra para ser a padrão). Arquivar e restaurar têm rotas próprias.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WalletPatch' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Wallet' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/wallets/{walletId}/archive:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [wallets]
      operationId: archiveWallet
      summary: Arquiva a carteira (só admin). Não existe exclusão. A padrão não pode ser arquivada (409 `wallet_is_default`).
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Wallet' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/wallets/{walletId}/restore:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: walletId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [wallets]
      operationId: restoreWallet
      summary: Restaura a carteira arquivada (só admin). 409 `wallet_exists` se já há outra ativa com o mesmo nome.
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Wallet' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --------------------------------------------------------------- transfers
  /households/{householdId}/transfers:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [transfers]
      operationId: listTransfers
      summary: Transferências do mês (qualquer membro), da data mais recente para a mais antiga
      description: |
        `month` é obrigatório (dia 1) e filtra pela competência. Não inclui as excluídas.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Transfer' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [transfers]
      operationId: createTransfer
      summary: Move dinheiro de uma carteira para outra (admin e member)
      description: |
        Não é receita nem despesa: só muda os saldos das duas carteiras. Origem e destino devem ser carteiras ATIVAS e
        diferentes da casa (senão 400 no campo). Se a origem tem o aviso de saldo ligado e o saldo realizado dela, até a
        competência, fica negativo, a resposta traz `warnings: ["wallet_balance_insufficient"]` (não bloqueia).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransferInput' } } }
      responses:
        '201': { description: "Criada", content: { application/json: { schema: { $ref: '#/components/schemas/TransferResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /households/{householdId}/transfers/{transferId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [transfers]
      operationId: deleteTransfer
      summary: Exclui (logicamente) a transferência; os saldos voltam ao que eram. Não há edição.
      responses:
        '204': { description: "Excluída" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /households/{householdId}/transfers/{transferId}/restore:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: transferId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [transfers]
      operationId: restoreTransfer
      summary: Desfaz a exclusão. 409 `not_deleted` se a transferência não está excluída.
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --------------------------------------------------------------- reserve
  /households/{householdId}/reserve:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [reserve]
      operationId: getReserve
      summary: Meta da reserva de emergência e progresso no mês (qualquer membro)
      description: |
        `targetMonths` nulo = a casa não configurou meta (a tela não mostra nada). Gasto essencial médio = média, nos 6 meses
        ANTES de `month` que tiveram alguma conta, das contas de categorias essenciais (ou filhas de uma essencial): valor pago,
        ou o da conta se pendente; sem histórico, usa o próprio mês. `savedCents` = soma do saldo realizado (o `balanceCents`
        do resumo) das carteiras marcadas como reserva. `targetCents` = meses × gasto essencial médio.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/ReserveStatus' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: [reserve]
      operationId: setReserve
      summary: Define a meta e as carteiras de reserva (só o Responsável, como as carteiras)
      description: |
        `targetMonths` de 1 a 36 (nulo desliga a meta). `walletIds` substitui a lista de carteiras que contam como reserva
        (vazia = nenhuma). Carteira que não é da casa = 400 em `walletIds`. Responde o status do mês atual.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReserveInput' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/ReserveStatus' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --------------------------------------------------------------- adjustments
  /households/{householdId}/wallet-adjustments:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [adjustments]
      operationId: listWalletAdjustments
      summary: Ajustes de saldo do mês (qualquer membro), do mais recente para o mais antigo
      description: |
        `month` é obrigatório (dia 1) e filtra pela competência. Não inclui os excluídos.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WalletAdjustment' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [adjustments]
      operationId: createWalletAdjustment
      summary: Confere o saldo de uma carteira (admin e member)
      description: |
        A pessoa informa o saldo REAL da carteira no fim do mês (`actualBalanceCents`); o servidor calcula o saldo
        realizado até o fim daquele mês (o mesmo `balanceCents` do resumo) e grava a diferença como ajuste. O ajuste não é
        receita nem despesa: só altera o saldo da carteira no mês e, pelo saldo anterior, nos meses seguintes.
        400 no campo quando: a carteira não é ativa da casa (`walletId`), o mês é futuro ou anterior ao mês de início da
        carteira (`competenceMonth`), ou o saldo já confere, isto é, a diferença é zero (`actualBalanceCents`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WalletAdjustmentInput' } } }
      responses:
        '201': { description: "Criado", content: { application/json: { schema: { $ref: '#/components/schemas/WalletAdjustment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /households/{householdId}/wallet-adjustments/{adjustmentId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: adjustmentId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [adjustments]
      operationId: deleteWalletAdjustment
      summary: Exclui (logicamente) o ajuste; o saldo volta ao calculado. Não há edição.
      responses:
        '204': { description: "Excluído" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /households/{householdId}/wallet-adjustments/{adjustmentId}/restore:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: adjustmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [adjustments]
      operationId: restoreWalletAdjustment
      summary: Desfaz a exclusão (a mesma diferença, sem recalcular). 409 `not_deleted` se o ajuste não está excluído.
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/WalletAdjustment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --------------------------------------------------------------- invoices
  /households/{householdId}/invoices:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [invoices]
      operationId: listInvoices
      summary: Lista invoices (tela do mês). Pagas continuam na lista.
      parameters:
        - { name: month, in: query, description: "Mês de competência (dia 1)", schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [pending, overdue, paid] } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: responsibleUserId, in: query, schema: { type: string, format: uuid } }
        - { name: purchaseId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: "Busca por descrição", schema: { type: string, maxLength: 120 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePage' } } } }
    post:
      tags: [invoices]
      operationId: createInvoice
      summary: Cria invoice avulsa (member+)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceInput' } } }
      responses:
        '201': { description: "Criada", content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/invoices/batch:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    post:
      tags: [invoices]
      operationId: createInvoiceBatch
      summary: Cria várias invoices avulsas de uma vez (member+), tudo ou nada
      description: |
        Usado pela tela "Importar". Cada item segue as regras do `createInvoice` (inclusive `boleto`, `payeeId` e `newPayee`).
        Tudo numa transação: se um item falhar, nenhum é gravado. Erros de validação vêm em `fields` com o índice do item
        (`items.3.amountCents`). A mesma linha digitável em dois itens do lote é recusada (`items.N.boleto.digitableLine`).
        `newPayee` com o mesmo nome em mais de um item cria um só favorecido. Corpo até 512 KB.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceBatchInput' } } }
      responses:
        '201': { description: "Criadas, na ordem dos itens", content: { application/json: { schema: { $ref: '#/components/schemas/InvoiceBatchResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/invoices/{invoiceId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { $ref: '#/components/parameters/InvoiceId' }
    get:
      tags: [invoices]
      operationId: getInvoice
      summary: Detalhe da invoice (inclui boleto, se houver)
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [invoices]
      operationId: updateInvoice
      summary: Edita invoice. Em série, `scope` define o alcance.
      description: "Com `scope=following` em parcelas, `description` é tratada como base e cada parcela recebe o sufixo ` (n/N)`."
      parameters:
        - { $ref: '#/components/parameters/SeriesScope' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePatch' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [invoices]
      operationId: deleteInvoice
      summary: Exclusão lógica. Em série, `scope` define o alcance.
      parameters:
        - { $ref: '#/components/parameters/SeriesScope' }
      responses:
        '204': { description: "Excluída" }
  /households/{householdId}/invoices/{invoiceId}/restore:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { $ref: '#/components/parameters/InvoiceId' }
    post:
      tags: [invoices]
      operationId: restoreInvoice
      summary: Desfaz a exclusão. Em série, `scope=following` desfaz o lote "esta e as seguintes".
      description: |
        `this` (padrão) restaura só esta invoice. `following` restaura, numa transação, esta e as da MESMA série com número/mês
        maior ou igual que foram excluídas JUNTO com ela (mesmo lote: mesmo `deleted_at`); exclusões avulsas anteriores
        continuam excluídas. Também desfaz o efeito do lote no cabeçalho: reabre a compra fechada e devolve o fim (ou reativa)
        a recorrência encerrada pelo lote. 409 se a recorrência mudou depois do lote (ex.: foi encerrada antes).
      parameters:
        - { $ref: '#/components/parameters/SeriesScope' }
      responses:
        '200': { description: "OK (a invoice escolhida)", content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/invoices/{invoiceId}/pay:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { $ref: '#/components/parameters/InvoiceId' }
    post:
      tags: [invoices]
      operationId: payInvoice
      summary: Marca como paga (afeta só esta invoice). Pode devolver aviso de saldo de benefício insuficiente.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PayRequest' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/PayResult' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [invoices]
      operationId: unpayInvoice
      summary: Desfaz o pagamento
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
  /households/{householdId}/purchases:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [invoices]
      operationId: listPurchases
      summary: Compras parceladas ("quando comprei o notebook?")
      parameters:
        - { name: q, in: query, description: "Busca por descrição", schema: { type: string, maxLength: 120 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/PurchasePage' } } } }
    post:
      tags: [invoices]
      operationId: createPurchase
      summary: Cria compra parcelada e gera todas as parcelas (passadas e futuras)
      description: "Numa transação: cabeçalho + N invoices (\"Notebook (1/6)\"...), vencimento mensal a partir de `firstDueDate` (trava no último dia do mês), competência = mês do vencimento."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseInput' } } }
      responses:
        '201': { description: "Criada (com as parcelas)", content: { application/json: { schema: { $ref: '#/components/schemas/Purchase' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /households/{householdId}/purchases/{purchaseId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: purchaseId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [invoices]
      operationId: getPurchase
      summary: Compra com todas as parcelas
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Purchase' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /households/{householdId}/recurrences:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [invoices]
      operationId: listRecurrences
      summary: Contas recorrentes
      description: Antes de responder, estende o horizonte das ocorrências (12 meses à frente).
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Recurrence' } } } } }
    post:
      tags: [invoices]
      operationId: createRecurrence
      summary: Cria recorrência e gera invoices até o horizonte
      description: "Uma invoice por mês de `startMonth` até 12 meses depois do maior entre hoje e o início (respeitando `endMonth`); vencimento = `dayOfMonth`, travado no último dia de mês curto."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecurrenceInput' } } }
      responses:
        '201': { description: "Criada", content: { application/json: { schema: { $ref: '#/components/schemas/Recurrence' } } } }
  /households/{householdId}/recurrences/{recurrenceId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: recurrenceId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [invoices]
      operationId: updateRecurrence
      summary: Edita ou encerra (end_month) a recorrência
      description: |
        Aplica às ocorrências futuras e pendentes (não pagas, vencimento de hoje em diante); pagas e passadas nunca mudam.
        `endMonth` só pode ser antecipado (não adiado nem limpo); as pendentes futuras depois do fim são excluídas.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecurrencePatch' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Recurrence' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- incomes
  /households/{householdId}/incomes:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [incomes]
      operationId: listIncomes
      summary: Receitas do mês (recebidas e a receber)
      description: |
        `month` é obrigatório (dia 1). Estende a repetição até esse mês, se ele estiver além do horizonte
        (até 60 meses à frente). Todos os membros da casa veem as receitas de todos.

        **Estado derivado** (não existe coluna de status): `received` é verdadeiro quando a data esperada chegou e ninguém
        marcou `held` ("não caiu"), ou quando foi marcada como recebida antes da data. `held` verdadeiro = "não caiu".
        Fora disso a receita está "a receber" (e "atrasada" se `held` e a data já passou).
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Income' } } } } }
    post:
      tags: [incomes]
      operationId: createIncome
      summary: Lança uma receita (avulsa ou que se repete todo mês)
      description: |
        Valor: `amountMode=fixed` (padrão; informe `grossAmountCents`) ou `per_unit` (informe `unitPriceCents`, opcionalmente
        `quantity`, que por padrão é o número de dias úteis do mês, e `unitLabel`). O bruto por unidade é sempre
        preço x quantidade. Data: `dateRule` (calcula a data de cada mês) e/ou `expectedDate` (data digitada; sem regra é
        obrigatória). Com `repeats=true` (exige `dateRule`) cria a repetição a partir de `competenceMonth`, até `repeatsUntil`
        (opcional), e devolve o lançamento do mês pedido.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IncomeInput' } } }
      responses:
        '201': { description: "Criada", content: { application/json: { schema: { $ref: '#/components/schemas/Income' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /households/{householdId}/incomes/{incomeId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: incomeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [incomes]
      operationId: updateIncome
      summary: Edita a receita. Se ela se repete, `scope` define o alcance.
      description: |
        `scope=this` (padrão) muda só este lançamento (inclusive pessoa, tipo, mês de competência, quantidade e data digitada).
        `scope=following` muda também o molde da repetição e reaplica os campos enviados a este e aos seguintes que ainda
        NÃO contam como recebidos; recebidos nunca mudam em lote. `competenceMonth`, `expectedDate` e `quantity` não valem
        em lote (400). Mudar o tipo NÃO muda a carteira (use `walletId`). Os descontos enviados
        substituem a lista. Sem repetição, `following` equivale a `this`.
      parameters:
        - { $ref: '#/components/parameters/IncomeScope' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IncomePatch' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Income' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [incomes]
      operationId: deleteIncome
      summary: Exclusão lógica. Se a receita se repete, `scope` define o alcance.
      description: |
        `following` exclui este e os seguintes que ainda não contam como recebidos (recebidos nunca somem em lote) e encerra
        a repetição no mês anterior. Todo o lote recebe o mesmo `deleted_at`, usado pelo Desfazer (`/restore?scope=following`).
      parameters:
        - { $ref: '#/components/parameters/IncomeScope' }
      responses:
        '204': { description: "Excluída" }
        '404': { $ref: '#/components/responses/NotFound' }
  /households/{householdId}/incomes/{incomeId}/restore:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: incomeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [incomes]
      operationId: restoreIncome
      summary: Desfaz a exclusão. `scope=following` desfaz o lote "este e os seguintes".
      description: |
        `following` restaura, numa transação, este e os da MESMA repetição com mês maior ou igual excluídos JUNTO com ele
        (mesmo `deleted_at`); exclusões avulsas anteriores continuam excluídas. Devolve o fim (ou reativa) a repetição.
        409 `series_changed` se a repetição mudou depois do lote; 409 `not_deleted` se não estava excluída.
      parameters:
        - { $ref: '#/components/parameters/IncomeScope' }
      responses:
        '200': { description: "OK (a receita escolhida)", content: { application/json: { schema: { $ref: '#/components/schemas/Income' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/incomes/{incomeId}/receive:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: incomeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [incomes]
      operationId: receiveIncome
      summary: '"Caiu": desfaz o "não caiu" (ou marca como recebida antes da data). Se já conta como recebida, 409 `already_received`.'
      description: |
        O recebimento é automático (a data esperada chegou). Esta rota só serve para (a) desfazer um "não caiu" e
        (b) marcar como recebida uma receita cuja data esperada ainda não chegou.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { receivedAt: { type: string, format: date, description: "Padrão hoje (só usado se a data esperada ainda não chegou)" } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Income' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [incomes]
      operationId: unreceiveIncome
      summary: '"Não caiu": a receita deixa de contar como recebida e fica fora do saldo. Se não contava, 409 `not_received`.'
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/Income' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /households/{householdId}/income-dates:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [incomes]
      operationId: previewIncomeDates
      summary: Prévia das datas de uma regra de data (sem gravar nada)
      description: |
        Para cada um dos `count` meses a partir de `month`, a data em que a regra cai (com o ajuste de fim de semana e
        feriados nacionais) e quantos dias úteis o mês tem (a quantidade sugerida para receitas por unidade).
        Com `monthOffset=-1` a regra é aplicada ao mês anterior de cada competência (a data devolvida pode ser do mês
        anterior), mas `businessDays` continua sendo os dias úteis da COMPETÊNCIA.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, format: date } }
        - { name: rule, in: query, required: true, schema: { $ref: '#/components/schemas/DateRuleKind' } }
        - { name: n, in: query, description: "Dia do mês (1 a 31) ou ordem do dia útil (1 a 23). Não se aplica a last_business_day.", schema: { type: integer } }
        - { name: weekendAdjust, in: query, schema: { $ref: '#/components/schemas/WeekendAdjust' } }
        - { name: monthOffset, in: query, schema: { $ref: '#/components/schemas/MonthOffset' } }
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 24, default: 3 } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IncomeDatePreview' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /households/{householdId}/tax/estimate:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [incomes]
      operationId: estimateTax
      summary: Estimativa de INSS e IRRF de um salário mensal (sugestão para preencher descontos)
      description: |
        Calculada pela tabela do ano de `month` (ou a mais recente, se o ano não tem tabela: veja `tableYear`). É uma
        ESTIMATIVA (`approximate` sempre verdadeiro): confira no holerite. Não grava nada.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, format: date } }
        - { name: grossCents, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: dependents, in: query, schema: { type: integer, minimum: 0, maximum: 20, default: 0 } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/TaxEstimate' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /households/{householdId}/income-sources:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [incomes]
      operationId: listIncomeSources
      summary: Receitas que se repetem (o molde de cada repetição)
      responses:
        '200': { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IncomeSource' } } } } }
    post:
      tags: [incomes]
      operationId: createIncomeSource
      summary: Cria uma repetição e gera os lançamentos até o horizonte
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IncomeSourceInput' } } }
      responses:
        '201': { description: "Criada", content: { application/json: { schema: { $ref: '#/components/schemas/IncomeSource' } } } }
  /households/{householdId}/income-sources/{sourceId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [incomes]
      operationId: updateIncomeSource
      summary: Edita o molde. `applyFrom` reaplica o molde aos meses a receber a partir dali.
      parameters:
        - { name: applyFrom, in: query, description: "Mês (dia 1). Reaplica o molde aos lançamentos que ainda NÃO contam como recebidos desse mês em diante; os recebidos nunca mudam.", schema: { type: string, format: date } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IncomeSourcePatch' } } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/IncomeSource' } } } }
    delete:
      tags: [incomes]
      operationId: deleteIncomeSource
      summary: Exclui a repetição e os lançamentos PREVISTOS dela (exclusão lógica)
      description: |
        Exclui (logicamente) todos os lançamentos da repetição que ainda NÃO contam como recebidos, num lote com o mesmo
        `deleted_at`, e encerra a repetição no mês anterior ao primeiro excluído (se não sobra mês antes do início, a
        repetição inteira é excluída). Recebidos nunca somem e meses já passados continuam no histórico. O corte vai para
        `income_source_cuts`; `POST .../restore` desfaz.
      responses:
        '204': { description: "Excluída" }
        '404': { $ref: '#/components/responses/NotFound' }
  /households/{householdId}/income-sources/{sourceId}/restore:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - { name: sourceId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [incomes]
      operationId: restoreIncomeSource
      summary: Desfaz a última exclusão da repetição (devolve a repetição e os lançamentos removidos no lote)
      description: |
        Restaura só o lote mais recente: os lançamentos com o MESMO `deleted_at` do corte (exclusões avulsas anteriores,
        de outros instantes, continuam excluídas) e devolve o fim (ou reativa) a repetição. 409 `series_changed` se a
        repetição mudou depois da exclusão; 409 `not_deleted` se não há exclusão a desfazer.
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/IncomeSource' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /households/{householdId}/export/invoices.csv:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [invoices]
      operationId: exportInvoicesCsv
      summary: Exporta as contas da casa em CSV (planilha). Todos os membros, inclusive leitura, podem exportar.
      description: |
        Filtra pelo **vencimento** (`from` e `to` inclusivos; ambos opcionais). Contas excluídas ficam de fora.
        Formato pensado para o Excel em português: UTF-8 com BOM, separador `;`, valores em reais com vírgula
        (`1234,56`) e datas `dd/mm/aaaa`. Colunas: vencimento, competência, descrição, categoria (`Mãe › Filha`),
        favorecido, valor, status (pendente, atrasada, paga), pago em, carteira, valor pago.
      parameters:
        - { name: from, in: query, description: "Vencimento a partir de (inclusive)", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Vencimento até (inclusive)", schema: { type: string, format: date } }
      responses:
        '200':
          description: "Arquivo CSV (Content-Disposition: attachment)"
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- summary
  /households/{householdId}/summary:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [summary]
      operationId: getMonthlySummary
      summary: Resumo do mês por competência, com saldos por carteira
      description: Estende a previsão (receitas e contas fixas) até o mês pedido, como as listagens. Todos os membros leem.
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/MonthlySummary' } } } }

  /households/{householdId}/summary/categories:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    get:
      tags: [summary]
      operationId: getCategoryHistory
      summary: Gasto por categoria mês a mês (histórico para os gráficos), por competência
      description: |
        Uma série por categoria FOLHA (a soma da categoria principal é feita no cliente), com todos os meses do intervalo
        (meses sem contas vêm com zero). `from` e `to` são dias 1; padrão = os 6 meses até o mês atual. Máximo 24 meses.
        Estende a previsão das contas fixas até `to`, como o resumo. Todos os membros leem.
      parameters:
        - { name: from, in: query, description: "Primeiro mês (dia 1). Padrão: 5 meses antes de `to`", schema: { type: string, format: date } }
        - { name: to, in: query, description: "Último mês (dia 1). Padrão: o mês atual", schema: { type: string, format: date } }
      responses:
        '200': { description: "OK", content: { application/json: { schema: { $ref: '#/components/schemas/CategoryHistory' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ----------------------------------------------------------------- boleto
  /households/{householdId}/boletos/extract:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    post:
      tags: [boleto]
      operationId: extractBoleto
      summary: Extrai dados de um boleto (PDF/PNG/JPG, até 5 MB). Nada é salvo; o usuário revisa antes de criar a invoice.
      description: |
        Síncrono. O arquivo fica só em memória. Se o PDF exigir senha, responde 422 com `code=password_required`;
        reenvie com o campo `password` (usado apenas em memória, nunca gravado nem logado).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                password: { type: string, format: password }
      responses:
        '200': { description: "Extraído", content: { application/json: { schema: { $ref: '#/components/schemas/BoletoExtraction' } } } }
        '413': { description: "Arquivo maior que 5 MB", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Não foi possível extrair ou senha necessária", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: "Servidor ocupado com outras leituras (`code=busy`); tente de novo", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /households/{householdId}/documents/extract:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    post:
      tags: [boleto]
      operationId: extractDocument
      summary: Lê contas de um arquivo (boleto, conta sem boleto ou lista). Nada é salvo; o usuário revisa antes de criar.
      description: |
        Mesmo upload, limites e regras de memória do `extractBoleto`. Ordem de decisão: (1) linha digitável válida =
        `boleto` (1 item com `boleto`); (2) valor com rótulo forte ("total a pagar", "valor a pagar", "valor do documento")
        ou com vencimento = `bill` (1 item sem boleto); (3) duas ou mais linhas "descrição R$ valor" = `list` (N itens);
        (4) um único valor (rótulo "total" ou o maior "R$ x") = `bill`. Nada disso = 422 `boleto_not_found`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                password: { type: string, format: password }
      responses:
        '200': { description: "Lido", content: { application/json: { schema: { $ref: '#/components/schemas/DocumentExtraction' } } } }
        '413': { description: "Arquivo maior que 5 MB", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Não foi possível ler ou senha necessária", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { description: "Servidor ocupado com outras leituras (`code=busy`); tente de novo", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /households/{householdId}/documents/parse-text:
    parameters: [ { $ref: '#/components/parameters/HouseholdId' } ]
    post:
      tags: [boleto]
      operationId: parseDocumentText
      summary: Lê contas de um texto escrito ou colado (mesmo resultado do `extractDocument`). Nada é salvo; o usuário revisa antes de criar.
      description: |
        Padrão de lista: UMA conta por linha, `descrição: valor` (ex.: `Gás: R$ 150,00`, `Mercado: 310,25`). Linha digitável no texto
        = `boleto`; senão as mesmas regras do `extractDocument` (`bill` ou `list`). Item forte = com `R$` ou valor com vírgula e 2 casas
        (com `:`, `=` ou `-`); item fraco = inteiro sem `R$` (`Teste: 567`), só vale com 2+ itens fortes. Sem OCR, sem disco, sem log
        do conteúdo. Mesmo limite de taxa por usuário do `extractDocument`. Resposta com `method: text`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 20000, description: "Até 20.000 caracteres (acima disso, 413)" }
      responses:
        '200': { description: "Lido", content: { application/json: { schema: { $ref: '#/components/schemas/DocumentExtraction' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: "Texto maior que 20.000 caracteres", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: "Não encontrei boleto nem valor de conta no texto (`code=boleto_not_found`)", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: prumia_session

  parameters:
    HouseholdId: { name: householdId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    InvoiceId: { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    IncomeScope:
      name: scope
      in: query
      description: |
        Em receita que se repete: `this` = só este mês; `following` = este e os seguintes que ainda NÃO contam como
        recebidos (recebidos nunca mudam em lote). Sem repetição equivale a `this`. Detalhes: docs/developer-guide/incomes-and-wallets.md.
      schema: { type: string, enum: [this, following], default: this }
    SeriesScope:
      name: scope
      in: query
      description: |
        `this` = só esta; `following` = esta e as seguintes da MESMA série (parcelas com `installmentNumber` maior ou igual;
        recorrência com `occurrenceMonth` maior ou igual). Em lote: só afeta as ainda NÃO pagas (as pagas ficam intactas, inclusive a
        escolhida), nunca marca como paga, e `dueDate`/`competenceMonth` não são aceitos (400). Em invoice avulsa equivale a `this`.
        No `DELETE` de recorrência, a série é encerrada no mês anterior (ou excluída, se for a 1ª ocorrência); no de compra, o
        cabeçalho é excluído quando não sobra parcela. Detalhes: docs/developer-guide/series-generation.md.
      schema: { type: string, enum: [this, following], default: this }

  responses:
    BadRequest: { description: "Requisição inválida", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: "Não autenticado", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: "Sem permissão", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: "Não encontrado", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: "Conflito de regra de negócio", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    TooManyRequests: { description: "Limite de requisições excedido", content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: "Código estável para o front (ex. `password_required`, `last_admin`)" }
        detail: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Erros por campo

    Cents:
      type: integer
      format: int64
      description: Valor em centavos (BRL)
    Month:
      type: string
      format: date
      description: Primeiro dia do mês
    Role: { type: string, enum: [admin, member, viewer] }
    DeductionKind: { type: string, enum: [inss, irrf, health_plan, health_copay, other] }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        householdName: { type: string, description: "Usado quando não há convite de casa" }
        inviteToken: { type: string, description: "Convite de casa: entra na casa de quem convidou" }
        signupToken: { type: string, description: "Convite de cadastro (do dono do sistema): cria conta e casa próprias. Não combina com inviteToken" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Me:
      type: object
      required: [id, name, email, theme, households, isSystemOwner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        theme: { $ref: '#/components/schemas/Theme' }
        isSystemOwner: { type: boolean, description: "Dono do sistema (a primeira conta): só ele gera convites de cadastro" }
        publicUrl:
          type: string
          format: uri
          description: |
            Endereço público do app (PUBLIC_URL do servidor), sem barra final. O front monta com ele os links de convite e de nova
            senha; ausente = usa o endereço do navegador de quem gera o link.
        households:
          type: array
          items: { $ref: '#/components/schemas/HouseholdRef' }

    Theme:
      type: string
      enum: [marfim, solarized, latte, dracula, nord, gruvbox, rosepine, contraste, sistema]
      description: Tema de cor da conta (padrão `marfim`, a identidade da marca). `sistema` usa o Marfim de dia e o Dracula no modo escuro do aparelho.

    MePatch:
      type: object
      description: Só os campos presentes mudam.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        theme: { $ref: '#/components/schemas/Theme' }

    HouseholdRef:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    Household:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    Member:
      type: object
      required: [userId, name, email, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        joinedAt: { type: string, format: date-time }
    SignupInvite:
      type: object
      required: [id, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    SignupInviteInput:
      type: object
      properties:
        expiresInHours: { type: integer, minimum: 1, maximum: 168, description: "Padrão 48" }
    SignupInviteCreated:
      type: object
      required: [id, token, expiresAt]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: "Só nesta resposta" }
        expiresAt: { type: string, format: date-time }
    InviteCreated:
      type: object
      required: [id, token, role, expiresAt]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: "Só nesta resposta" }
        role: { $ref: '#/components/schemas/Role' }
        expiresAt: { type: string, format: date-time }

    Category:
      type: object
      required: [id, name, isEssential, sortOrder, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        defaultWalletId: { type: string, format: uuid, nullable: true, description: "Carteira sugerida ao pagar (opcional)" }
        isEssential: { type: boolean }
        sortOrder: { type: integer }
        archived: { type: boolean }
        parentId: { type: string, format: uuid, nullable: true, description: "Categoria principal (só dois níveis); null = de topo" }
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        defaultWalletId: { type: string, format: uuid, nullable: true, description: "Carteira da casa, não arquivada (senão 400 no campo defaultWalletId)" }
        isEssential: { type: boolean, default: false }
        parentId: { type: string, format: uuid, nullable: true, description: "Cria dentro desta categoria principal" }
    CategoryPatch:
      type: object
      properties:
        name: { type: string }
        defaultWalletId: { type: string, format: uuid, nullable: true, description: "null limpa a sugestão" }
        isEssential: { type: boolean }
        sortOrder: { type: integer }
        archived: { type: boolean }
        parentId: { type: string, format: uuid, nullable: true, description: "Move para dentro de uma categoria principal; null = volta ao topo" }

    CnpjInfo:
      type: object
      required: [cnpj, legalName]
      properties:
        cnpj: { type: string, pattern: '^[0-9]{14}$' }
        legalName: { type: string }
        tradeName: { type: string, nullable: true }
    Payee:
      type: object
      required: [id, name, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "Apelido escolhido pela casa (ex.: Gás)" }
        cnpj: { type: string, pattern: '^[0-9]{14}$', nullable: true, description: "Só dígitos" }
        legalName: { type: string, nullable: true, description: "Razão social, informativa" }
        defaultCategoryId: { type: string, format: uuid, nullable: true }
        archived: { type: boolean }
    PayeeInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        cnpj: { type: string, nullable: true, description: "Com ou sem máscara; os dígitos verificadores são conferidos" }
        legalName: { type: string, nullable: true, maxLength: 120 }
        defaultCategoryId: { type: string, format: uuid, nullable: true }
    PayeePatch:
      type: object
      properties:
        name: { type: string }
        cnpj: { type: string, nullable: true }
        legalName: { type: string, nullable: true }
        defaultCategoryId: { type: string, format: uuid, nullable: true }
        archived: { type: boolean }

    Invoice:
      type: object
      required: [id, categoryId, description, amountCents, dueDate, competenceMonth, status]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        responsibleUserId: { type: string, format: uuid, nullable: true }
        payeeId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountCents: { $ref: '#/components/schemas/Cents' }
        dueDate: { type: string, format: date }
        competenceMonth: { $ref: '#/components/schemas/Month' }
        status:
          type: string
          enum: [pending, overdue, paid]
          description: Derivado (não é coluna). `overdue` = pendente com vencimento passado.
        paid:
          type: object
          allOf: [ { $ref: '#/components/schemas/Payment' } ]
          nullable: true
        series:
          type: object
          allOf: [ { $ref: '#/components/schemas/SeriesRef' } ]
          nullable: true
        boleto:
          type: object
          allOf: [ { $ref: '#/components/schemas/Boleto' } ]
          nullable: true
        notes: { type: string, nullable: true }
    Payment:
      type: object
      required: [paidAt, walletId, amountCents]
      properties:
        paidAt: { type: string, format: date }
        walletId: { type: string, format: uuid }
        amountCents: { $ref: '#/components/schemas/Cents' }
        paidByUserId: { type: string, format: uuid, nullable: true }
    SeriesRef:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [installment, recurrence] }
        purchaseId: { type: string, format: uuid, nullable: true }
        installmentNumber: { type: integer, nullable: true }
        installmentsCount: { type: integer, nullable: true }
        recurrenceId: { type: string, format: uuid, nullable: true }
    InvoiceInput:
      type: object
      required: [categoryId, description, amountCents, dueDate]
      properties:
        categoryId: { type: string, format: uuid }
        responsibleUserId: { type: string, format: uuid, nullable: true }
        payeeId: { type: string, format: uuid, nullable: true }
        description: { type: string, minLength: 1, maxLength: 120 }
        amountCents: { $ref: '#/components/schemas/Cents' }
        dueDate: { type: string, format: date }
        competenceMonth: { allOf: [ { $ref: '#/components/schemas/Month' } ], description: "Padrão = mês do vencimento" }
        notes: { type: string, nullable: true }
        boleto: { type: object, allOf: [ { $ref: '#/components/schemas/Boleto' } ], nullable: true }
        newPayee:
          type: object
          nullable: true
          description: "Cria o favorecido junto com a conta (uma só operação). Não combina com payeeId. Com boleto, leva o CNPJ e a razão social do boleto; sem boleto, os de `cnpj`/`legalName` (conta sem boleto lida na importação). A categoria da conta vira a sugerida."
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 60 }
            cnpj: { type: string, pattern: '^[0-9]{14}$', description: "Só sem boleto (com boleto vale o do boleto)" }
            legalName: { type: string, maxLength: 120, description: "Só sem boleto" }
    InvoicePatch:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        responsibleUserId: { type: string, format: uuid, nullable: true }
        payeeId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountCents: { $ref: '#/components/schemas/Cents' }
        dueDate: { type: string, format: date }
        competenceMonth: { $ref: '#/components/schemas/Month' }
        notes: { type: string, nullable: true }
    InvoicePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        nextCursor: { type: string, nullable: true }
    PayRequest:
      type: object
      required: [walletId]
      properties:
        walletId: { type: string, format: uuid, description: "Carteira da casa, não arquivada (senão 400 no campo walletId)" }
        paidAt: { type: string, format: date, description: "Padrão hoje" }
        amountCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Padrão = valor da invoice (informe se houve juros/desconto)" }
    PayResult:
      type: object
      required: [invoice]
      properties:
        invoice: { $ref: '#/components/schemas/Invoice' }
        warnings:
          type: array
          description: Avisos que não bloqueiam. Hoje só `wallet_balance_insufficient` (veja `warningDetails` para a carteira).
          items: { type: string }
        warningDetails:
          type: array
          description: Detalhe dos avisos, na mesma ordem de `warnings`.
          items: { $ref: '#/components/schemas/PayWarning' }
    PayWarning:
      type: object
      required: [code, walletId]
      properties:
        code: { type: string, description: "Igual ao item de `warnings` (ex. `wallet_balance_insufficient`)" }
        walletId: { type: string, format: uuid, description: "Carteira com aviso de saldo ligado cujo saldo realizado ficou negativo" }

    Boleto:
      type: object
      required: [digitableLine]
      properties:
        digitableLine: { type: string, pattern: '^[0-9]{47,48}$' }
        barcode: { type: string, pattern: '^[0-9]{44}$', nullable: true }
        beneficiaryName: { type: string, nullable: true }
        beneficiaryVerified: { type: boolean, description: "Verdadeiro quando o nome de quem recebe foi conferido pelo CNPJ na BrasilAPI (resposta da extração; ignorado ao salvar)" }
        beneficiaryCnpj: { type: string, pattern: '^[0-9]{14}$', nullable: true, description: "CNPJ de quem recebe, lido do texto e validado pelos dígitos verificadores" }
        documentAmountCents: { type: integer, allOf: [ { $ref: '#/components/schemas/Cents' } ], nullable: true }
        documentDueDate: { type: string, format: date, nullable: true }
        documentCompetenceMonth: { type: string, format: date, nullable: true, description: "Mês de referência lido do texto (dia 1), quando o documento informa" }
    BoletoExtraction:
      type: object
      required: [boleto, method]
      properties:
        boleto: { $ref: '#/components/schemas/Boleto' }
        method: { type: string, enum: [pdf_text, barcode_image, ocr], description: "Como foi extraído" }
        duplicateOfInvoiceId: { type: string, format: uuid, nullable: true, description: "Já existe invoice com esta linha digitável" }
        payee: { type: object, allOf: [ { $ref: '#/components/schemas/Payee' } ], nullable: true, description: "Favorecido da casa com o CNPJ lido do boleto (não arquivado)" }

    InvoiceBatchInput:
      type: object
      required: [items]
      properties:
        items: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/InvoiceInput' } }
    InvoiceBatchResult:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
    DocumentItem:
      type: object
      description: Uma conta encontrada no arquivo. Tudo é sugestão para revisar; campos ausentes não foram lidos.
      properties:
        description: { type: string, description: "Descrição sugerida (item da lista ou nome de quem cobra)" }
        amountCents: { $ref: '#/components/schemas/Cents' }
        dueDate: { type: string, format: date }
        competenceMonth: { $ref: '#/components/schemas/Month' }
        beneficiaryName: { type: string }
        beneficiaryCnpj: { type: string, pattern: '^[0-9]{14}$' }
        beneficiaryVerified: { type: boolean, description: "Nome conferido pelo CNPJ na BrasilAPI" }
        boleto: { $ref: '#/components/schemas/Boleto' }
        duplicateOfInvoiceId: { type: string, format: uuid, description: "Já existe invoice com esta linha digitável" }
        payee: { $ref: '#/components/schemas/Payee' }
    DocumentExtraction:
      type: object
      required: [method, kind, items]
      properties:
        method: { type: string, enum: [pdf_text, barcode_image, ocr, text], description: "Como foi lido (`text` = texto escrito ou colado)" }
        kind:
          type: string
          enum: [boleto, bill, list]
          description: "`boleto` = linha digitável válida; `bill` = conta sem linha digitável (só valor/vencimento); `list` = várias contas (ex.: print de conversa)"
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DocumentItem' } }
    Purchase:
      type: object
      required: [id, description, purchaseDate, totalAmountCents, installmentsCount, categoryId, installments]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        responsibleUserId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        purchaseDate: { type: string, format: date }
        totalAmountCents: { $ref: '#/components/schemas/Cents' }
        installmentsCount: { type: integer }
        notes: { type: string, nullable: true }
        installments:
          type: array
          description: "Parcelas não excluídas, por número. Sempre presente (também na listagem)."
          items: { $ref: '#/components/schemas/Invoice' }
    PurchaseInput:
      type: object
      required: [categoryId, description, purchaseDate, totalAmountCents, installmentsCount, firstDueDate]
      properties:
        categoryId: { type: string, format: uuid }
        responsibleUserId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        purchaseDate: { type: string, format: date }
        totalAmountCents: { $ref: '#/components/schemas/Cents' }
        installmentsCount: { type: integer, minimum: 2, maximum: 120 }
        firstDueDate: { type: string, format: date, description: "Vencimento da 1ª parcela (as demais seguem mensalmente)" }
        installmentAmountCents:
          allOf: [ { $ref: '#/components/schemas/Cents' } ]
          description: |
            Opcional. Padrão = total / parcelas, com o resto de centavos na última parcela. Se informado, TODAS as parcelas valem
            exatamente isso (sem resto) e `totalAmountCents` fica como informado (a soma das parcelas pode diferir, ex.: juros).
        notes: { type: string, nullable: true }
    PurchasePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Purchase' } }
        nextCursor: { type: string, nullable: true }

    Recurrence:
      type: object
      required: [id, categoryId, description, amountCents, dayOfMonth, startMonth]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        responsibleUserId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountCents: { $ref: '#/components/schemas/Cents' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        startMonth: { $ref: '#/components/schemas/Month' }
        endMonth: { type: string, allOf: [ { $ref: '#/components/schemas/Month' } ], nullable: true }
        generatedThrough: { $ref: '#/components/schemas/Month' }
        notes: { type: string, nullable: true }
    RecurrenceInput:
      type: object
      required: [categoryId, description, amountCents, dayOfMonth, startMonth]
      properties:
        categoryId: { type: string, format: uuid }
        responsibleUserId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountCents: { $ref: '#/components/schemas/Cents' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        startMonth: { $ref: '#/components/schemas/Month' }
        endMonth: { type: string, allOf: [ { $ref: '#/components/schemas/Month' } ], nullable: true }
        notes: { type: string, nullable: true }
    RecurrencePatch:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        responsibleUserId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        amountCents: { $ref: '#/components/schemas/Cents' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        endMonth: { type: string, allOf: [ { $ref: '#/components/schemas/Month' } ], nullable: true }
        notes: { type: string, nullable: true }

    Deduction:
      type: object
      required: [kind, name, amountCents]
      properties:
        kind: { $ref: '#/components/schemas/DeductionKind' }
        name: { type: string }
        amountCents: { $ref: '#/components/schemas/Cents' }
    AmountMode: { type: string, enum: [fixed, per_unit], description: "fixed = valor cheio; per_unit = preço por unidade x quantidade" }
    DateRuleKind: { type: string, enum: [day_of_month, nth_business_day, last_business_day] }
    WeekendAdjust: { type: string, enum: [forward, backward, none], description: "Quando a data cai em fim de semana ou feriado nacional: forward = próximo dia útil (padrão), backward = dia útil anterior, none = manter" }
    MonthOffset: { type: integer, enum: [-1, 0], default: 0, description: "Em que mês, em relação à competência, a regra de data é aplicada: 0 = no mês da competência (padrão); -1 = no mês anterior (ex.: o vale de outubro cai no último dia útil de setembro). A competência não muda, só a data." }
    DateRule:
      type: object
      required: [rule]
      description: "Quando a receita cai em cada mês. `n` é o dia (day_of_month, 1 a 31) ou a ordem do dia útil (nth_business_day, 1 a 23); não se aplica a last_business_day."
      properties:
        rule: { $ref: '#/components/schemas/DateRuleKind' }
        n: { type: integer, nullable: true }
        weekendAdjust: { allOf: [ { $ref: '#/components/schemas/WeekendAdjust' } ], description: "Padrão forward" }
        monthOffset: { $ref: '#/components/schemas/MonthOffset' }
    Income:
      type: object
      required: [id, userId, kind, description, walletId, competenceMonth, expectedDate, amountMode, grossAmountCents, netAmountCents, deductions, received, held, repeats]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid, nullable: true }
        userId: { type: string, format: uuid }
        kind: { type: string, enum: [salary, benefit, other] }
        description: { type: string }
        walletId: { type: string, format: uuid, description: "Carteira onde a receita cai (o front resolve o nome pela lista de carteiras)" }
        competenceMonth: { $ref: '#/components/schemas/Month' }
        expectedDate: { type: string, format: date }
        amountMode: { $ref: '#/components/schemas/AmountMode' }
        grossAmountCents: { $ref: '#/components/schemas/Cents' }
        unitPriceCents: { type: integer, allOf: [ { $ref: '#/components/schemas/Cents' } ], nullable: true, description: "Só por unidade" }
        quantity: { type: integer, nullable: true, description: "Só por unidade. Bruto = preço x quantidade" }
        unitLabel: { type: string, nullable: true, description: "Só por unidade (ex.: dia trabalhado, hora)" }
        dateRule: { type: object, allOf: [ { $ref: '#/components/schemas/DateRule' } ], nullable: true, description: "Regra que calculou a data (nulo = data digitada)" }
        deductions: { type: array, items: { $ref: '#/components/schemas/Deduction' } }
        netAmountCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Calculado = bruto - descontos (somente leitura)" }
        received: { type: boolean, description: "Derivado: a data esperada chegou (ou foi marcada antes) e não está em `held`. Conta no saldo." }
        receivedAt: { type: string, format: date, nullable: true, description: "Dia em que entrou (a data marcada ou, no recebimento automático, a data esperada). Nulo se não recebida." }
        held: { type: boolean, description: '"Não caiu": o dinheiro previsto ainda não entrou; não conta como recebida até alguém dizer "caiu".' }
        repeats: { type: boolean, description: "A repetição continua depois deste mês" }
        repeatsUntil: { type: string, allOf: [ { $ref: '#/components/schemas/Month' } ], nullable: true, description: "Último mês da repetição (nulo = sem fim)" }
        notes: { type: string, nullable: true }
    IncomeInput:
      type: object
      required: [userId, kind, description, competenceMonth]
      properties:
        userId: { type: string, format: uuid, description: "Deve ser membro ativo da casa" }
        kind: { type: string, enum: [salary, benefit, other] }
        walletId: { type: string, format: uuid, description: "Opcional. Padrão = carteira padrão da casa (para o tipo benefit, a carteira ativa chamada Benefício, se existir). Carteira de outra casa ou arquivada = 400 no campo walletId. Qualquer tipo pode ir para qualquer carteira." }
        description: { type: string }
        competenceMonth: { $ref: '#/components/schemas/Month' }
        expectedDate: { type: string, format: date, description: "Data digitada. Obrigatória se não houver dateRule; com repeats vale só para o primeiro mês." }
        amountMode: { allOf: [ { $ref: '#/components/schemas/AmountMode' } ], description: "Padrão fixed" }
        grossAmountCents: { $ref: '#/components/schemas/Cents' }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        quantity: { type: integer, description: "Por unidade. Padrão: dias úteis do mês" }
        unitLabel: { type: string, description: "Por unidade. Padrão: unidade" }
        dateRule: { $ref: '#/components/schemas/DateRule' }
        repeats: { type: boolean, description: "Repete todo mês a partir de competenceMonth (exige dateRule)" }
        repeatsUntil: { type: string, allOf: [ { $ref: '#/components/schemas/Month' } ], nullable: true }
        deductions: { type: array, items: { $ref: '#/components/schemas/Deduction' } }
        notes: { type: string, nullable: true }
    IncomePatch:
      type: object
      properties:
        userId: { type: string, format: uuid }
        kind: { type: string, enum: [salary, benefit, other] }
        walletId: { type: string, format: uuid, description: "Muda a carteira (trocar o tipo não troca a carteira)" }
        description: { type: string }
        competenceMonth: { $ref: '#/components/schemas/Month' }
        expectedDate: { type: string, format: date }
        amountMode: { $ref: '#/components/schemas/AmountMode' }
        grossAmountCents: { $ref: '#/components/schemas/Cents' }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        quantity: { type: integer }
        unitLabel: { type: string }
        dateRule: { $ref: '#/components/schemas/DateRule' }
        deductions: { type: array, items: { $ref: '#/components/schemas/Deduction' } }
        notes: { type: string, nullable: true }
    IncomeSource:
      type: object
      required: [id, userId, kind, walletId, name, amountMode, grossAmountCents, dayOfMonth, dateRule, startMonth, deductions]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        kind: { type: string, enum: [salary, benefit, other] }
        walletId: { type: string, format: uuid }
        name: { type: string }
        amountMode: { $ref: '#/components/schemas/AmountMode' }
        grossAmountCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Fixo: o valor. Por unidade: espelha o preço (o bruto de cada mês é preço x quantidade)." }
        unitPriceCents: { type: integer, allOf: [ { $ref: '#/components/schemas/Cents' } ], nullable: true }
        unitLabel: { type: string, nullable: true }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, description: "Legado: o dia da regra day_of_month (1 nas demais regras). Use dateRule." }
        dateRule: { $ref: '#/components/schemas/DateRule' }
        startMonth: { $ref: '#/components/schemas/Month' }
        endMonth: { type: string, allOf: [ { $ref: '#/components/schemas/Month' } ], nullable: true }
        generatedThrough: { allOf: [ { $ref: '#/components/schemas/Month' } ], description: "Último mês com lançamento gerado" }
        notes: { type: string, nullable: true }
        deductions: { type: array, items: { $ref: '#/components/schemas/Deduction' } }
    IncomeSourceInput:
      type: object
      required: [userId, kind, name, startMonth]
      properties:
        userId: { type: string, format: uuid, description: "Deve ser membro ativo da casa" }
        kind: { type: string, enum: [salary, benefit, other] }
        walletId: { type: string, format: uuid, description: "Opcional. Mesmas regras de IncomeInput.walletId. Cada lançamento gerado copia a carteira da fonte." }
        name: { type: string }
        amountMode: { $ref: '#/components/schemas/AmountMode' }
        grossAmountCents: { $ref: '#/components/schemas/Cents' }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        quantity: { type: integer, description: "Por unidade: quantidade do primeiro mês (os demais usam os dias úteis)" }
        unitLabel: { type: string }
        dateRule: { $ref: '#/components/schemas/DateRule' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, description: "Atalho antigo: equivale a dateRule day_of_month com ajuste forward. Ignorado se dateRule vier." }
        startMonth: { $ref: '#/components/schemas/Month' }
        endMonth: { type: string, allOf: [ { $ref: '#/components/schemas/Month' } ], nullable: true }
        notes: { type: string, nullable: true }
        deductions: { type: array, items: { $ref: '#/components/schemas/Deduction' } }
    IncomeSourcePatch:
      type: object
      properties:
        userId: { type: string, format: uuid }
        kind: { type: string, enum: [salary, benefit, other] }
        walletId: { type: string, format: uuid, description: "Muda a carteira do molde (e dos lançamentos que ainda não contam como recebidos, com applyFrom)" }
        name: { type: string }
        notes: { type: string, nullable: true }
        amountMode: { $ref: '#/components/schemas/AmountMode' }
        grossAmountCents: { $ref: '#/components/schemas/Cents' }
        unitPriceCents: { $ref: '#/components/schemas/Cents' }
        unitLabel: { type: string }
        dateRule: { $ref: '#/components/schemas/DateRule' }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31, description: "Atalho antigo: troca para a regra day_of_month mantendo o ajuste atual" }
        endMonth: { type: string, allOf: [ { $ref: '#/components/schemas/Month' } ], nullable: true }
        deductions: { type: array, items: { $ref: '#/components/schemas/Deduction' } }
    IncomeDatePreview:
      type: object
      required: [month, expectedDate, businessDays]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        expectedDate: { type: string, format: date }
        businessDays: { type: integer, description: "Dias úteis do mês (sábado, domingo e feriados nacionais não contam)" }
    TaxEstimate:
      type: object
      required: [inssCents, irrfCents, tableYear, sources, checkedOn, approximate]
      properties:
        inssCents: { $ref: '#/components/schemas/Cents' }
        irrfCents: { $ref: '#/components/schemas/Cents' }
        tableYear: { type: integer, description: "Ano da tabela usada (pode ser diferente do mês pedido, se o ano não tem tabela)" }
        sources: { type: array, items: { type: string }, description: "URLs oficiais conferidas" }
        checkedOn: { type: string, format: date, description: "Quando as tabelas foram conferidas" }
        approximate: { type: boolean, description: "Sempre verdadeiro: é uma estimativa" }

    Wallet:
      type: object
      required: [id, name, isDefault, warnOnOverdraft, openingBalanceCents, sortOrder, archived]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        ownerUserId: { type: string, format: uuid, nullable: true, description: "Só etiqueta (de quem é a carteira); não restringe o uso" }
        isDefault: { type: boolean, description: "Exatamente uma por casa" }
        warnOnOverdraft: { type: boolean, description: "Avisa ao pagar se o saldo realizado desta carteira ficar negativo" }
        openingBalanceCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Saldo inicial (pode ser negativo); vale a partir de openingBalanceMonth (sem mês, entra no saldo anterior de todos os meses)" }
        openingBalanceMonth: { type: string, format: date, nullable: true, description: "Mês (dia 1) a partir do qual o saldo inicial vale; meses anteriores não recebem o saldo inicial nem o saldo anterior. null = desde o início" }
        sortOrder: { type: integer }
        archived: { type: boolean }
    WalletInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: "Único entre as carteiras ativas da casa (sem diferenciar maiúsculas)" }
        ownerUserId: { type: string, format: uuid, nullable: true, description: "Deve ser membro da casa" }
        warnOnOverdraft: { type: boolean, default: true }
        openingBalanceCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Padrão 0" }
        openingBalanceMonth: { type: string, format: date, nullable: true, description: "Mês (dia 1) a partir do qual o saldo inicial vale; dia diferente de 1 = 400 no campo. Padrão null (desde o início)" }
        sortOrder: { type: integer, description: "Padrão = fim da lista" }
    WalletPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        ownerUserId: { type: string, format: uuid, nullable: true, description: "null limpa o dono" }
        warnOnOverdraft: { type: boolean }
        openingBalanceCents: { $ref: '#/components/schemas/Cents' }
        openingBalanceMonth: { type: string, format: date, nullable: true, description: "null limpa o mês de início (volta a valer desde o início); dia diferente de 1 = 400 no campo" }
        isDefault: { type: boolean, description: "true troca a carteira padrão da casa; false = 400" }
        sortOrder: { type: integer }
    Transfer:
      type: object
      required: [id, fromWalletId, toWalletId, amountCents, transferDate, competenceMonth]
      properties:
        id: { type: string, format: uuid }
        fromWalletId: { type: string, format: uuid }
        toWalletId: { type: string, format: uuid }
        amountCents: { $ref: '#/components/schemas/Cents' }
        transferDate: { type: string, format: date }
        competenceMonth: { $ref: '#/components/schemas/Month' }
        notes: { type: string, nullable: true }
    TransferInput:
      type: object
      required: [fromWalletId, toWalletId, amountCents]
      properties:
        fromWalletId: { type: string, format: uuid, description: "Carteira ativa da casa (senão 400 no campo)" }
        toWalletId: { type: string, format: uuid, description: "Carteira ativa da casa, diferente da origem (senão 400 no campo)" }
        amountCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Maior que zero, até o teto dos demais valores" }
        transferDate: { type: string, format: date, description: "Padrão hoje" }
        competenceMonth: { allOf: [ { $ref: '#/components/schemas/Month' } ], description: "Padrão = mês da data da transferência" }
        notes: { type: string, nullable: true, maxLength: 500 }
    ReserveStatus:
      type: object
      required: [targetMonths, walletIds, essentialMonthlyCents, basisMonths, savedCents, targetCents]
      properties:
        targetMonths: { type: integer, nullable: true, description: "Meta em meses de gasto essencial; null = sem meta" }
        walletIds: { type: array, items: { type: string, format: uuid }, description: "Carteiras que contam como reserva" }
        essentialMonthlyCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Gasto essencial médio por mês" }
        basisMonths: { type: integer, description: "Quantos meses entraram na média (0 = ainda sem gasto essencial)" }
        savedCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Saldo realizado das carteiras de reserva no mês" }
        targetCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Meses × gasto essencial médio (0 sem meta ou sem gasto)" }
    ReserveInput:
      type: object
      required: [targetMonths, walletIds]
      properties:
        targetMonths: { type: integer, nullable: true, minimum: 1, maximum: 36 }
        walletIds: { type: array, items: { type: string, format: uuid } }
    WalletAdjustment:
      type: object
      required: [id, walletId, competenceMonth, amountCents, createdAt]
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        competenceMonth: { $ref: '#/components/schemas/Month' }
        amountCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "A diferença gravada, com sinal: positivo = havia mais do que o calculado; negativo = menos" }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    WalletAdjustmentInput:
      type: object
      required: [walletId, actualBalanceCents]
      properties:
        walletId: { type: string, format: uuid, description: "Carteira ativa da casa (senão 400 no campo)" }
        competenceMonth: { allOf: [ { $ref: '#/components/schemas/Month' } ], description: "Mês conferido; padrão = mês atual. Futuro ou anterior ao mês de início da carteira = 400" }
        actualBalanceCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Saldo real da carteira no fim do mês (pode ser negativo). Igual ao calculado = 400" }
        notes: { type: string, nullable: true, maxLength: 500 }
    TransferResult:
      type: object
      required: [transfer]
      properties:
        transfer: { $ref: '#/components/schemas/Transfer' }
        warnings:
          type: array
          description: Avisos que não bloqueiam. Hoje só `wallet_balance_insufficient` (carteira de origem; veja `warningDetails`).
          items: { type: string }
        warningDetails:
          type: array
          items: { $ref: '#/components/schemas/PayWarning' }
    WalletBalance:
      type: object
      required: [walletId, name, isDefault, archived, openingBalanceCents, carryOverCents, expectedIncomeCents, receivedIncomeCents, paidCents, transfersInCents, transfersOutCents, adjustmentsCents, balanceCents, monthBalanceCents, pendingCents, projectedCents]
      properties:
        walletId: { type: string, format: uuid }
        name: { type: string }
        ownerUserId: { type: string, format: uuid, nullable: true }
        isDefault: { type: boolean }
        archived: { type: boolean, description: "Carteira arquivada só aparece se tem saldo anterior diferente de zero ou movimento (inclusive transferência) no mês" }
        openingBalanceCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Saldo inicial da carteira" }
        openingBalanceMonth: { type: string, format: date, nullable: true, description: "Mês (dia 1) a partir do qual o saldo inicial vale; null = desde o início. Em meses anteriores a ele, carryOverCents é 0" }
        carryOverCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Saldo anterior: saldo inicial + soma, dos meses ANTERIORES ao consultado (e a partir do mês de início, se houver), de (receitas recebidas líquidas - despesas pagas + transferências recebidas - transferências enviadas + ajustes de saldo) da carteira, por competência. Antes do mês de início = 0" }
        expectedIncomeCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Líquido de todas as receitas da competência na carteira (a receber + recebidas)" }
        receivedIncomeCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Líquido das receitas que contam como recebidas (data esperada chegou e ninguém disse não caiu)" }
        paidCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Valor efetivamente pago das invoices da competência pagas com esta carteira" }
        transfersInCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Transferências recebidas de outras carteiras na competência" }
        transfersOutCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Transferências enviadas para outras carteiras na competência" }
        adjustmentsCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Soma (com sinal) dos ajustes de saldo (Conferir saldo) da competência. Não é receita nem despesa" }
        balanceCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Saldo REALIZADO acumulado: saldo anterior + recebido - pago + transferências recebidas - enviadas + ajustes (não é saldo bancário)" }
        monthBalanceCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Só o mês: recebido - pago + transferências recebidas - enviadas + ajustes" }
        pendingCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Estimativa do que falta pagar com esta carteira: invoices pendentes da competência atribuídas pela carteira padrão da categoria (ou da categoria principal; sem padrão = carteira padrão da casa). A carteira real só é conhecida ao pagar." }
        projectedCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Saldo projetado: saldo anterior + previsto para entrar - (pago + a pagar) + transferências recebidas - enviadas + ajustes do mês. Negativo = vai faltar." }
    MonthlySummary:
      type: object
      required: [month, wallets, totalPaidCents, totalPendingCents, overdueCents, overdueCount, byCategory]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        wallets:
          type: array
          description: Carteira padrão primeiro, depois por sortOrder e nome.
          items: { $ref: '#/components/schemas/WalletBalance' }
        totalPaidCents: { $ref: '#/components/schemas/Cents' }
        totalPendingCents: { $ref: '#/components/schemas/Cents' }
        overdueCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Parte do pendente já vencida (vencimento antes de hoje)" }
        overdueCount: { type: integer, description: "Quantas invoices da competência estão atrasadas" }
        byCategory:
          type: array
          description: Ordenado por total (maior primeiro). Inclui categorias arquivadas que tenham invoices no mês.
          items: { $ref: '#/components/schemas/CategoryTotal' }
    CategoryHistory:
      type: object
      required: [months, series]
      properties:
        months: { type: array, items: { $ref: '#/components/schemas/Month' }, description: "Todos os meses do intervalo, em ordem" }
        series:
          type: array
          description: Uma por categoria com contas no intervalo, da maior soma para a menor. Cada uma tem um ponto por mês de `months`.
          items: { $ref: '#/components/schemas/CategorySeries' }
    CategorySeries:
      type: object
      required: [categoryId, points]
      properties:
        categoryId: { type: string, format: uuid }
        points: { type: array, items: { $ref: '#/components/schemas/CategoryPoint' } }
    CategoryPoint:
      type: object
      required: [month, totalCents, paidCents, seriesCents]
      properties:
        month: { $ref: '#/components/schemas/Month' }
        totalCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Como no resumo: pago (valor efetivo) + pendente (valor da invoice)" }
        paidCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Parte já paga" }
        seriesCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Parte do total que é parcela ou conta fixa (compromissos)" }
    CategoryTotal:
      type: object
      required: [categoryId, totalCents, paidCents]
      properties:
        categoryId: { type: string, format: uuid }
        totalCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Pago (valor efetivamente pago) + pendente (valor da invoice) da competência" }
        paidCents: { allOf: [ { $ref: '#/components/schemas/Cents' } ], description: "Parte já paga (valor efetivamente pago)" }
