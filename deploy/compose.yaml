# prumia: 3 containers (db, api, web). Uso: `make up` (lê o .env da raiz).
name: prumia

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prumia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (rode make env)}
      POSTGRES_DB: ${POSTGRES_DB:-prumia}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Sem "ports": o banco só é acessível dentro da rede do compose. Para o DBeaver: make db-expose (compose.dbeaver.yaml).

  api:
    build: ../api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      AUTO_MIGRATE: "true"
      # Cadastro sem convite: só o 1º usuário se cadastra sozinho; deixe false depois (ver docs/developer-guide/authentication.md)
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-prumia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prumia}?sslmode=disable
    # /tmp em memória: as ferramentas de leitura de boleto podem criar arquivos temporários, e boleto nunca deve tocar o disco.
    tmpfs:
      - /tmp
    # O processo já roda sem root (Dockerfile); aqui ele também não ganha privilégio nenhum depois (setuid) nem
    # capacidades do kernel. Nada no app precisa delas (pdftotext/gs/tesseract testados assim).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    # Sem "ports": só o nginx conversa com a API.

  web:
    build: ../web
    restart: unless-stopped
    ports:
      # Por padrão só o próprio computador acessa. Para testar pelo celular na rede, defina WEB_BIND=0.0.0.0.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # nginx sem root (imagem nginx-unprivileged), sistema de arquivos só leitura e sem capacidades do kernel.
    # /tmp em memória: pid e buffers temporários do nginx (o upload de boleto também fica só em memória).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
