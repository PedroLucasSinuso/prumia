# Único arquivo de configuração do proxy. Na VPS (fase 2) é aqui que entram o TLS e o certbot.
# Segurança: docs/developer-guide/security.md.

# Log de acesso SEM query string e sem Referer: os links de convite e de nova senha levam o token na query
# (/convite?token=..., /redefinir-senha?token=...) e o formato padrão do nginx ("combined") gravava o token em claro.
map $request_uri $prumia_path {
    ~^(?<path>[^?]*) $path;
}
log_format prumia '$remote_addr [$time_local] "$request_method $prumia_path $server_protocol" $status $body_bytes_sent '
                  '$request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log prumia;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;          # não anuncia a versão do nginx
    client_max_body_size 1m;    # padrão para tudo; /api sobe para o upload de boleto
    client_header_timeout 15s;  # conexões lentas de propósito (slowloris) não prendem o servidor
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeçalhos de segurança. O app é same-origin: tudo (API incluída) vem do próprio host.
    # Atenção: no nginx, um `add_header` dentro de um location APAGA os herdados do server; por isso o
    # location / repete a lista inteira.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS: só com HTTPS (VPS com certbot, ou `tailscale serve`/`funnel` na frente). Em HTTP puro o navegador ignora,
    # mas se um dia o mesmo nome for servido por HTTPS ele "gruda" por 1 ano: ative só quando o HTTPS for definitivo.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # API: o prefixo /api é mantido (o Go serve as rotas sob /api).
    location /api/ {
        proxy_pass http://api:8080;
        # $http_host (e não $host) preserva a porta: a API compara o Origin do navegador com o Host (anti-CSRF).
        proxy_set_header Host $http_host;
        # IP real: a API lê SÓ o X-Real-IP, e só quando a conexão vem da rede interna (o nginx). Os dois cabeçalhos são
        # SOBRESCRITOS com o IP que o nginx viu, nunca acrescentados ao que o cliente mandou (que pode ser forjado).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 75s;     # leitura de boleto pode levar até 60 s (OCR); o resto responde em milissegundos
        client_max_body_size 6m;    # boleto: limite da API é 5 MB + margem do multipart (JSON comum: 64 KB, na API)
        client_body_buffer_size 6m; # mantém o upload em memória (acima disso o nginx gravaria um arquivo temporário)
        add_header Cache-Control "no-store" always; # respostas da API (dados financeiros) não ficam em cache
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Arquivos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: qualquer outra rota cai no index.html (o React cuida da navegação). Sem cache, para atualizar o app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
