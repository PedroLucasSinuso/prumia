# Integração contínua do prumia. Cinco jobs independentes (rodam em paralelo):
# api (Go), web (React), site (documentação), hooks (guard de Git do Claude Code) e docker (compose + imagens).
# Reproduzir localmente: ver docs/developer-guide/getting-started.md, seção "Integração contínua".
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR/branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # `make lint` também confere o código gerado, o que regenera os tipos TS: precisa do node_modules do front.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      # Ferramentas da leitura de boleto: sem elas o TestRealPDFTools é pulado. Os .deb ficam em cache: o espelho do apt às
      # vezes leva minutos para entregar ~30 MB. Primeiro tenta sem `apt-get update` (índice da imagem + .deb do cache); se a
      # imagem mudou e o índice não bate, atualiza e baixa de novo.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-boleto-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-boleto-${{ runner.os }}-
      - name: Instala poppler, Ghostscript e Tesseract
        run: |
          mkdir -p ~/apt-archives/partial
          PKGS="poppler-utils ghostscript tesseract-ocr tesseract-ocr-por"
          OPTS="-y -q --no-install-recommends -o Dir::Cache::Archives=$HOME/apt-archives"
          sudo apt-get install $OPTS $PKGS || { sudo apt-get update -q && sudo apt-get install $OPTS $PKGS; }
          sudo chown -R "$USER" ~/apt-archives

      - name: Lint (gofmt, vet, OpenAPI, código gerado em dia)
        run: make lint

      # Os testes de integração são PULADOS (não falham) sem Docker; aqui garantimos que ele existe.
      - name: Confere o Docker (testcontainers)
        run: docker info --format '{{.ServerVersion}}'

      - name: Testes (unitários + integração com Postgres via testcontainers)
        run: make test

  web:
    name: web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Lint (oxlint)
        run: npx oxlint
      - name: Testes (Vitest)
        run: npx vitest run
      - name: Build
        run: npm run build

      - name: Tipos da API em dia com openapi/openapi.yaml
        run: |
          npm run --silent generate:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::web/src/api/schema.d.ts desatualizado: rode 'make generate' e commite o resultado"
            exit 1
          }

  site:
    name: site (documentação)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # O build gera as páginas a partir de docs/ e falha com link interno quebrado (starlight-links-validator).
      - name: Build (com conferência de links)
        run: npm run build

  hooks:
    name: hooks (guard de Git)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make hooks-test

  docker:
    name: docker (compose e imagens)
    runs-on: ubuntu-latest
    # Valores fictícios só para o compose resolver as variáveis; nada sobe nem é publicado.
    env:
      POSTGRES_PASSWORD: ci-ficticia
    steps:
      - uses: actions/checkout@v4

      - name: Valida o compose
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Build das imagens api e web (sem push)
        run: docker compose -f deploy/compose.yaml build api web

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # O app inteiro (nginx + API + Postgres) pelo mesmo compose de produção, num projeto e banco descartáveis.
      - name: Sobe o app de teste
        run: make e2e-up

      - name: Instala o Playwright e o Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Testes de ponta a ponta
        working-directory: e2e
        run: npx playwright test

      - name: Logs dos containers (se falhou)
        if: failure()
        run: docker compose -p prumia-e2e logs --no-color --tail 200

      # Relatório com trace e captura de tela de cada falha. Os dados são todos fictícios (criados pelos testes).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  security:
    name: security (vulnerabilidades conhecidas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # govulncheck só acusa vulnerabilidade em código que o prumia realmente chama (não em qualquer dependência listada).
      # @latest de propósito: é ferramenta oficial do Go e precisa acompanhar a versão da linguagem (uma versão antiga
      # fixada quebrou com o Go do projeto).
      - name: Go (govulncheck)
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # npm audit lê só o package-lock (não instala nada). Dependências de produção, severidade alta ou crítica.
      - name: npm audit (web)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      # Site: só informa, não reprova. Os avisos atuais (astro, sharp/libvips, esbuild) só se resolvem com o Astro 7, que o
      # Starlight ainda não aceita (conflito de peer dependency em 11/2026). O site é estático: essas bibliotecas rodam só no
      # build, sobre os nossos próprios arquivos, e nada delas vai para quem visita. Tirar o continue-on-error quando o
      # Starlight suportar o Astro 7 (o Dependabot vai propor a atualização).
      - name: npm audit (site, informativo)
        working-directory: site
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

